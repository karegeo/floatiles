<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FloaTiles — apparatus 3D viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0f1116; color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #viewer { position: absolute; inset: 0; }
  #overlay {
    position: absolute; top: 16px; left: 16px; right: 16px;
    background: rgba(26,29,36,0.85);
    border: 1px solid #2a2f3a;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13px;
    max-width: 480px;
    backdrop-filter: blur(4px);
  }
  #overlay h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #overlay p { margin: 4px 0; color: #c0c5cf; line-height: 1.5; }
  #overlay a { color: #4ea1f3; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; color: #8a94a3;
  }
  kbd {
    background: #262b35; border: 1px solid #353b46;
    border-radius: 3px; padding: 1px 5px; font-size: 11px;
  }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="overlay">
  <h1>FloaTiles apparatus — 3D view</h1>
  <p>Conceptual OpenSCAD model of the table-and-pool, motor cage, eccentric, and pool. Approximate, not a literal blueprint of the built apparatus.</p>
  <p><kbd>drag</kbd> rotate · <kbd>scroll</kbd> zoom · <kbd>right-drag</kbd> pan · <a href="./">back to project page</a></p>
</div>
<div id="loading">Loading model…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('viewer');
const loading = document.getElementById('loading');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1116);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 20000);
camera.position.set(2500, -2500, 1800);
camera.up.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const hemi = new THREE.HemisphereLight(0xddeeff, 0x222233, 0.7);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 0.8);
key.position.set(1500, -2000, 2500);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.3);
fill.position.set(-1500, 1500, 1500);
scene.add(fill);

const grid = new THREE.GridHelper(3000, 30, 0x444444, 0x2a2f3a);
grid.rotation.x = Math.PI / 2;
scene.add(grid);

const loader = new STLLoader();
loader.load(
  'apparatus.stl',
  (geometry) => {
    geometry.computeVertexNormals();
    const material = new THREE.MeshStandardMaterial({
      color: 0x9aa0aa,
      metalness: 0.25,
      roughness: 0.65,
      flatShading: false
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    geometry.computeBoundingBox();
    const bbox = geometry.boundingBox;
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    controls.target.copy(center);

    const size = new THREE.Vector3();
    bbox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim / (2 * Math.tan((camera.fov * Math.PI / 180) / 2)) * 1.4;
    const dir = new THREE.Vector3(1, -1, 0.7).normalize();
    camera.position.copy(center.clone().add(dir.multiplyScalar(dist)));
    controls.update();

    loading.remove();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      loading.textContent = `Loading model… ${pct}%`;
    }
  },
  (err) => {
    loading.textContent = 'Failed to load apparatus.stl';
    console.error(err);
  }
);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
